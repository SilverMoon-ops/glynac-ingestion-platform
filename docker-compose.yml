version: "3.9"

services:
  api:
    build: .
    container_name: glynac-api
    ports:
      - "8000:8000"
    depends_on:
      mock-services:
        condition: service_started
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: minio
      CLICKHOUSE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      CLICKHOUSE_S3_ENDPOINT: http://minio:9000   # how ClickHouse itself reaches MinIO to read landed files
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      DATABASE_URL: sqlite:///data/glynac.db
      SALESFORCE_MOCK_ENABLED: "true"
      MOCK_SERVICES_URL: http://mock-services:9000
      HUBSPOT_MOCK_ENABLED: "true"
      SLACK_MOCK_ENABLED: "true"
      API_INTERNAL_URL: http://api:8000   # where the mock Slack delivers Events API webhooks
    volumes:
      - ./data:/app/data
      - ./.dlt_pipelines:/app/.dlt_pipelines
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - glynac-network

  mock-services:
    build: .
    container_name: glynac-mock-services
    command: python -m mock_services
    ports:
      - "9100:9000"   # host 9000 is MinIO's; containers reach the mocks at mock-services:9000
    networks:
      - glynac-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: glynac-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: glynac_admin
      MINIO_ROOT_PASSWORD: glynac_secret_key
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - glynac-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: glynac-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_USER: glynac
      CLICKHOUSE_PASSWORD: glynac_secret
      CLICKHOUSE_DB: glynac
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - glynac-network

volumes:
  minio_data:
  clickhouse_data:

networks:
  glynac-network:
    driver: bridge
