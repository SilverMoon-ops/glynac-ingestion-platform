version: "3.9"

services:
  api:
    build: .
    container_name: glynac-api
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_started
    environment:
      STORAGE_BACKEND: minio
      CLICKHOUSE_ENABLED: true
      HMAC_SECRET: local-dev-secret-change-in-prod
      SALESFORCE_MOCK_ENABLED: true
      HUBSPOT_MOCK_ENABLED: true
    volumes:
      - ./data:/app/data
      - ./.dlt_pipelines:/app/.dlt_pipelines
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - glynac-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: glynac-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: glynac_admin
      MINIO_ROOT_PASSWORD: glynac_secret_key
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glynac-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: glynac-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_USER: glynac
      CLICKHOUSE_PASSWORD: glynac_secret
      CLICKHOUSE_DB: glynac
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - glynac-network

volumes:
  minio_data:
  clickhouse_data:

networks:
  glynac-network:
    driver: bridge
